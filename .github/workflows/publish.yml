name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# A release upload must never be cancelled halfway through.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Third-party actions are pinned to commit SHAs because the publish job holds
# the portal token and the signing key.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # Fails in seconds, before any toolchain setup, on a mistyped tag or a
      # tag that does not point at a commit on main.
      - name: Check that the tag matches the catalog version and sits on main
        run: |
          version=$(sed -n 's/^flavor = "\(.*\)"$/\1/p' gradle/libs.versions.toml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match flavor = $version in gradle/libs.versions.toml"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME does not point at a commit on main"
            exit 1
          fi

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      # A Maven Central release cannot be deleted, so the library is tested
      # and linted again right before it is published.
      - name: Test and lint the library
        run: ./gradlew :flavor:test :flavor:lint

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The environment holds the secrets. Add a required reviewer to it in the
    # repository settings to approve every release by hand.
    environment: maven-central

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Publish to Maven Central
        run: ./gradlew :flavor:publishAndReleaseToMavenCentral
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
